[project]
name = "fhoutgen"
version = "0.1.0"
description = "fhout lip-sync data from a voice (training, analysis and generation)"
requires-python = ">=3.11"
dependencies = [
    "torch==2.11.0",
    "numpy",
    "scipy",
]

[dependency-groups]
# python/export_onnx.py and its check against PyTorch
export = ["onnx", "onnxruntime"]
# vocal separation of a mix before generation (Demucs)
separate = ["demucs", "soundfile", "torchaudio==2.11.0"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
